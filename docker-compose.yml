# Local infrastructure for future changes (DB schema, sessions).
# The application does not connect to these containers yet.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity_development
    ports:
      # 5433 on the host: 5432 is taken by other local projects
      - "5433:5432"
    volumes:
      # postgres:18+ expects the mount one level above the data directory
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity_development"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10
    ports:
      # 6380 on the host: 6379 is taken by other local projects
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: identity
      RABBITMQ_DEFAULT_PASS: identity
    ports:
      # 5673/15673 on the host: keeping the non-default-port convention
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Local SAML IdP for SSO development; start with the "sso" profile:
  #   docker compose --profile sso up -d   (or: mise run up-sso)
  keycloak:
    build:
      context: ./dev/keycloak
    profiles: [sso]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
