schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Identity & Access Service (Go) для экосистемы GSH / DFM.
  Архитектурное решение от 2026-09-09 (источник:
  ~/dev/notes/architecture/gsh-dfm-shared-ui-identity.md):
  - Общий React/Apollo UI, одна браузерная cookie-сессия (HttpOnly, opaque
    session id), GraphQL Router (Cosmo Router, спайк на стенде выполнен) как единая
    точка входа для GSH, DFM, в будущем ERP и Messenger.
  - Этот сервис владеет: SAML SSO через Okta, серверными сессиями в Redis,
    едиными пользователями (стабильный UUID, email — атрибут), ролями,
    permissions и назначениями в PostgreSQL, журналом изменений доступа.
  - Внутренний HTTP API проверки сессии для external authorization входного
    proxy (вариант — Envoy Gateway ext-auth); GraphQL API для профилей и
    управления доступом (совместимость с Federation требует проверки).
  - События изменений пользователей: transactional outbox в PostgreSQL →
    RabbitMQ → локальные проекции пользователей в бизнес-сервисах.
  - Роли принадлежат приложениям (например, DFM/engineer,
    GSH/sourcing_manager); доменные проверки остаются в сервисах
    (ActionPolicy); полная копия ролей в GSH/DFM не создаётся.
  - Не реализуем собственную криптографию или SAML-протокол; не разделяем
    сессии и роли на отдельные приложения. Развёртывание — Kubernetes.
  - Стек выбран и зафиксирован архивом change'ей: Go 1.27, net/http без
    фреймворка, gqlgen (Federation v2), crewjam/saml, alexedwards/scs +
    Redis, pgx + goose, RabbitMQ (amqp091), Envoy Gateway (ext-auth),
    Cosmo Router. Доверенный контекст — заголовки X-Identity-* от ext-auth
    (interim, без подписи; подписанный контекст — отдельное решение).
  - Ключ идентичности — неизменяемый id IdP (Okta user.id): persistent
    SAML NameID и SCIM externalId несут одно значение; email — атрибут.

