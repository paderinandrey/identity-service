{{- if and (index .Values.dependencies "keycloak").enabled .Values.gateway.enabled }}
{{- /*
Keycloak needs a browser-reachable hostname: its SAML metadata carries
absolute URLs that the browser follows. The service still fetches the
metadata document over the in-cluster Service name.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "identity-service.fullname" . }}-keycloak
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ (index .Values.dependencies "keycloak").hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "identity-service.fullname" . }}-keycloak
          port: {{ (index .Values.dependencies "keycloak").port }}
{{- end }}
