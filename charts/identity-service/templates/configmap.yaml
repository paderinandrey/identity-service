apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity-service.fullname" . }}
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
data:
  {{- /* Secrets (DATABASE_URL, REDIS_URL, RABBITMQ_URL, RELAY_STATE_SECRET,
         SCIM_TOKEN, SENTRY_DSN) belong in the referenced Secret, not here. */}}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
