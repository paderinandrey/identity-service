{{- if and .Values.gateway.enabled .Values.gateway.extAuth.enabled }}
{{- $fullName := include "identity-service.fullname" . }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullName }}-ext-auth
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullName }}-protected
  extAuth:
    # Envoy sends the auth service only a small default header set; the
    # session cookie must be listed explicitly or validate never sees it.
    headersToExtAuth:
      {{- toYaml .Values.gateway.extAuth.headersToExtAuth | nindent 6 }}
    http:
      # Validation lives in the internal zone; the public port does not
      # know the route at all.
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.internalPort }}
      path: {{ .Values.gateway.extAuth.path }}
      headersToBackend:
        {{- toYaml .Values.gateway.extAuth.headersToBackend | nindent 8 }}
{{- end }}
