{{- if .Values.debugEcho.enabled }}
{{- /*
Stand-only upstream that echoes the request it received. It is the only
way to assert the other half of the ext-auth contract: that the identity
headers actually reach the protected backend. Never enabled outside a stand.
*/}}
{{- $fullName := include "identity-service.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-echo
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: echo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-echo
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: echo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: echo
    spec:
      containers:
        - name: echo
          image: {{ .Values.debugEcho.image | quote }}
          ports:
            - containerPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-echo
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /debug/echo
        # Точное совпадение с корнем, а не префикс: после входа без `next`
        # пользователь возвращается на "/" и должен увидеть свой контекст,
        # а не 404. Префикс "/" перехватил бы и неопубликованные пути,
        # сломав проверку «внутреннее наружу не маршрутизируется».
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: {{ $fullName }}-echo
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $fullName }}-echo-ext-auth
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $fullName }}-echo
  extAuth:
    # Envoy sends the auth service only a small default header set; the
    # session cookie must be listed explicitly or validate never sees it.
    headersToExtAuth:
      {{- toYaml .Values.gateway.extAuth.headersToExtAuth | nindent 6 }}
    http:
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
      path: {{ .Values.gateway.extAuth.path }}
      headersToBackend:
        {{- toYaml .Values.gateway.extAuth.headersToBackend | nindent 8 }}
{{- end }}
