# Local stand overlay.
#
# DEV-ONLY credentials, committed on purpose: these are the same loud-fake
# values docker-compose and the README already use. They MUST be overridden
# for any non-local deploy — production takes secrets from existingSecret.

replicaCount: 1

image:
  repository: identity-service
  tag: dev
  # The image is built locally; OrbStack shares its Docker daemon with the
  # cluster, so there is nothing to pull.
  pullPolicy: Never

podDisruptionBudget:
  enabled: false

# The migration hook runs pre-install, before any regular resource of the
# release exists. In production that is fine: the database is managed and
# already there. On the stand PostgreSQL is created by this same release,
# so at hook time there is no database to migrate — a limitation of the
# stand's single-release layout, not of the hook. The stand script runs
# migrations once the dependencies are ready; the hook itself is proven by
# the first-install step of stand-verify (chart into an empty namespace,
# external database).
dbmigrate:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi

config:
  APP_ENV: development
  LOG_LEVEL: info
  LISTEN_ADDR: ":8080"
  SHUTDOWN_TIMEOUT: 10s
  # *.localhost, not a public domain: Chrome resolves it to loopback itself
  # (RFC 6761) and treats it as a secure context. The public localtest.me
  # was worse — OrbStack's DNS proxy rewrites loopback answers into its own
  # 198.18.x range, which the browser then cannot reach (ERR_EMPTY_RESPONSE),
  # while curl, using the macOS resolver, got 127.0.0.1 and worked.
  BASE_URL: "http://identity.localhost"
  FRONTEND_BASE_URL: "http://identity.localhost"
  SAML_IDP_METADATA_URL: "http://identity-stand-identity-service-keycloak:8080/realms/identity/protocol/saml/descriptor"
  DATABASE_URL: "postgres://identity:identity@identity-stand-identity-service-postgresql:5432/identity_development?sslmode=disable"
  REDIS_URL: "redis://identity-stand-identity-service-redis:6379/0"
  RABBITMQ_URL: "amqp://identity:identity@identity-stand-identity-service-rabbitmq:5672/"
  RELAY_STATE_SECRET: "local-dev-relay-state-secret-0123456789"
  SCIM_TOKEN: "local-dev-scim-token-0123456789abcdef"
  E2E_LOGIN_TOKEN: "local-dev-e2e-token-0123456789abcdef"

debugEcho:
  enabled: true

gateway:
  enabled: true
  parentRefs:
    - name: identity-gateway
      namespace: identity-stand
  hostnames:
    - identity.localhost
  # /graphql ведёт в router, а не напрямую в сервис: сабграфы за ним.
  protectedBackendRefs:
    - name: identity-stand-identity-service-router
      port: 3002

dependencies:
  postgresql:
    enabled: true
    image: postgres:18
    port: 5432
    portName: postgres
    env:
      - name: POSTGRES_USER
        value: identity
      - name: POSTGRES_PASSWORD
        value: identity
      - name: POSTGRES_DB
        value: identity_development
    readinessProbe:
      exec:
        command: ["pg_isready", "-U", "identity", "-d", "identity_development"]
      initialDelaySeconds: 3
      periodSeconds: 5
  redis:
    enabled: true
    image: redis:8.10
    port: 6379
    portName: redis
    readinessProbe:
      exec:
        command: ["redis-cli", "ping"]
      initialDelaySeconds: 3
      periodSeconds: 5
  rabbitmq:
    enabled: true
    image: rabbitmq:4.2-management
    port: 5672
    portName: amqp
    extraPorts:
      - name: management
        containerPort: 15672
    env:
      - name: RABBITMQ_DEFAULT_USER
        value: identity
      - name: RABBITMQ_DEFAULT_PASS
        value: identity
    readinessProbe:
      exec:
        command: ["rabbitmq-diagnostics", "-q", "ping"]
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 12
  router:
    enabled: true
    # Cosmo Router: композиция суперграфа статическая (файл в ConfigMap),
    # schema registry для стенда не нужен.
    image: ghcr.io/wundergraph/cosmo/router:latest
    port: 3002
    portName: http
    env:
      - name: EXECUTION_CONFIG_FILE_PATH
        value: /etc/router/supergraph.json
      - name: CONFIG_PATH
        value: /etc/router/config.yaml
    volumeMounts:
      - name: config
        mountPath: /etc/router
    volumes:
      - name: config
        configMap:
          name: router-config
    readinessProbe:
      httpGet:
        path: /health
        port: 3002
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 20
  stub-subgraph:
    enabled: true
    # Стоит за GSH/DFM в спайке federation: владеет Order и ссылается на
    # нашу entity User, плюс докладывает, какие identity-заголовки реально
    # дошли до сабграфа через router.
    image: stub-subgraph:dev
    pullPolicy: Never
    port: 8080
    portName: http
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
  keycloak:
    enabled: true
    # Built locally from dev/keycloak (Keycloak + SCIM client plugin).
    image: identity-service-keycloak:latest
    pullPolicy: Never
    port: 8080
    portName: http
    # Browser-facing hostname: SAML metadata carries absolute URLs that the
    # browser follows, so the IdP must advertise a name reachable outside
    # the cluster. The service itself fetches metadata over the Service name.
    hostname: keycloak.localhost
    args: ["start-dev", "--import-realm"]
    env:
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: admin
      - name: KC_HOSTNAME
        value: "http://keycloak.localhost"
      - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
        value: "true"
    volumeMounts:
      - name: realm
        mountPath: /opt/keycloak/data/import
    volumes:
      - name: realm
        configMap:
          name: identity-stand-identity-service-keycloak-realm
    readinessProbe:
      httpGet:
        path: /realms/identity
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 5
      failureThreshold: 30
