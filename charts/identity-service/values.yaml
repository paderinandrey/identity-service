# Default values for identity-service.
# Per-environment values (image tag, hostnames, secret name, resources)
# are supplied by ArgoCD; this file only holds safe defaults.

replicaCount: 2
revisionHistoryLimit: 3
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/paderinandrey/identity-service
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# Non-secret configuration, rendered into a ConfigMap as environment
# variables. Secrets (DATABASE_URL, REDIS_URL, RABBITMQ_URL,
# RELAY_STATE_SECRET, SCIM_TOKEN, SENTRY_DSN) must come from existingSecret.
config:
  APP_ENV: production
  LOG_LEVEL: info
  LISTEN_ADDR: ":8080"
  SHUTDOWN_TIMEOUT: 20s

# Name of an existing Secret with the sensitive environment variables.
existingSecret: ""

extraEnv: []

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Probe paths are fixed by the service contract (/healthz, /readyz);
# only timings are configurable here.
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Schema migrations run as a pre-install/pre-upgrade hook, before the new
# pods start (matches the GSH convention).
dbmigrate:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Gateway API resources (Envoy Gateway). Kept in this chart so the entry
# configuration is versioned with the service it protects.
gateway:
  enabled: false
  parentRefs: []
  #  - name: identity-gateway
  #    namespace: envoy-gateway-system
  hostnames: []
  # Sign-in and provisioning must work without a session.
  publicPaths:
    - /auth/
    - /scim/v2/
  # Everything here goes through ext-auth.
  protectedPaths:
    - /graphql
  # Set when /graphql should reach the GraphQL Router instead of this service.
  protectedBackendRefs: []
  extAuth:
    enabled: true
    path: /internal/session/validate
    # Forwarded to the auth service. Envoy's default allowlist does not
    # include Cookie, and the session lives in a cookie.
    headersToExtAuth:
      - cookie
    headersToBackend:
      - X-Identity-User-Id
      - X-Identity-Email
      - X-Identity-Permissions

nodeSelector: {}
tolerations: []
affinity: {}

# Stand-only dependencies (PostgreSQL, Redis, RabbitMQ, Keycloak).
# Disabled by default: production points at managed instances via
# existingSecret. Enabled together by values-local.yaml.
dependencies:
  postgresql:
    enabled: false
  redis:
    enabled: false
  rabbitmq:
    enabled: false
  keycloak:
    enabled: false

# Stand-only echo upstream used to assert that ext-auth forwards the
# identity headers to the protected backend. Never enable in production.
debugEcho:
  enabled: false
  image: ealen/echo-server:latest
