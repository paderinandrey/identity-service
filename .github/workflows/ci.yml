name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with mise.toml.
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
          POSTGRES_DB: identity_development
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U identity -d identity_development"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.2
        env:
          RABBITMQ_DEFAULT_USER: identity
          RABBITMQ_DEFAULT_PASS: identity
        ports:
          - "5673:5672"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/identity-service
      - name: Render with defaults
        run: helm template ci charts/identity-service > /dev/null
      - name: Render with gateway, autoscaling and monitoring enabled
        run: |
          helm template ci charts/identity-service \
            --set gateway.enabled=true \
            --set 'gateway.parentRefs[0].name=identity-gateway' \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set existingSecret=identity-secrets > /dev/null

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go tool gqlgen generate
      - name: Generated code must match the schema
        run: git diff --exit-code
