[tools]
go = "1.27.1"
golangci-lint = "2.13.2"

[tasks.build]
description = "Build the service binary into bin/"
run = "go build -o bin/identity-service ./cmd/identity-service"



[tasks.lint]
description = "Run golangci-lint (extra args after -- are appended)"
run = "golangci-lint run"

[tasks.test]
description = "Run tests with the race detector (extra flags after -- are appended, e.g. -- -run TestFoo)"
run = "go test -race ./..."

[tasks.run]
description = "Run the service locally"
run = "go run ./cmd/identity-service"

[tasks.up]
description = "Start local PostgreSQL, Redis and RabbitMQ"
run = "docker compose up -d --wait"

[tasks."stand:up"]
description = "Bring up the full Kubernetes stand (Envoy Gateway, dependencies, service)"
run = "./scripts/stand-up.sh"

[tasks."stand:verify"]
description = "Prove the stand end to end: sign-in through the IdP form to context headers upstream"
run = "./scripts/stand-verify.sh"

[tasks."stand:down"]
description = "Tear down the Kubernetes stand"
run = "./scripts/stand-down.sh"

[tasks."chart:check"]
description = "Helm chart lint and render checks (same script CI runs)"
run = "./scripts/ci-helm-checks.sh"

[tasks.up-sso]
description = "Start local infrastructure plus Keycloak (SAML IdP for SSO development)"
run = "docker compose --profile sso up -d --wait"

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

[tasks.generate]
description = "Regenerate gqlgen GraphQL code from the schema"
run = "go tool gqlgen generate"
