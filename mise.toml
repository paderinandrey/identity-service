[tools]
go = "1.27.1"
golangci-lint = "2.13.2"

[tasks.build]
description = "Build the service binary into bin/"
run = "go build -o bin/identity-service ./cmd/identity-service"

[tasks.test]
description = "Run tests with the race detector; pass packages/flags after -- (default ./...)"
run = 'go test -race {{arg(name="args", var=true, default="./...")}}'

[tasks.lint]
description = "Run golangci-lint; pass paths/flags after --"
run = 'golangci-lint run {{arg(name="args", var=true, default="./...")}}'

[tasks.run]
description = "Run the service locally"
run = "go run ./cmd/identity-service"

[tasks.up]
description = "Start local PostgreSQL, Redis and RabbitMQ"
run = "docker compose up -d --wait"

[tasks.up-sso]
description = "Start local infrastructure plus Keycloak (SAML IdP for SSO development)"
run = "docker compose --profile sso up -d --wait"

[tasks.vuln]
description = "Scan dependencies for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@latest ./..."

[tasks.generate]
description = "Regenerate gqlgen GraphQL code from the schema"
run = "go tool gqlgen generate"
